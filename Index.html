<!DOCTYPE html>
<html lang="pt_BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculadora de IMC</title>
	<script src="CalculadoraIMC.js"></script>
	<link rel="stylesheet" href="Estilos.css">
</head>
<body>
	<div class="calculadora-container">

		<h1>Calculadora de IMC</h1>
		<h2>Descubra aqui o seu<br>Índice de Massa Corporal (IMC)</h2>

		<label for="peso">Peso (kg): </label>
		<input type="number" id="peso" placeholder="Ex.: 85">

		<label for="altura">Altura (m): </label>
		<input type="number" id="altura" placeholder="Ex.: 1,80">

		<button onclick="calcularIMC()">Calcular</button>

		<div class="resultados">
			<p id="resultadoIMC"></p>
			<p id="classificacaoIMC"></p>
		</div>
	</div>

</body>
</html>
